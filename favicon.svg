<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#0f172a"/>
  <!-- AI Agent Icon - Clean and Bold -->
  <g transform="translate(50,50)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#1e3a5f" stroke-width="2"/>
    <!-- Robot head -->
    <rect x="-18" y="-20" width="36" height="30" rx="6" fill="none" stroke="#3b82f6" stroke-width="3.5"/>
    <!-- Left eye -->
    <rect x="-11" y="-12" width="7" height="7" rx="2" fill="#3b82f6"/>
    <!-- Right eye -->
    <rect x="4" y="-12" width="7" height="7" rx="2" fill="#3b82f6"/>
    <!-- Smile -->
    <path d="M-8,2 Q0,10 8,2" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Antenna -->
    <line x1="0" y1="-20" x2="0" y2="-30" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-33" r="4" fill="#60a5fa"/>
    <!-- Signal waves from antenna -->
    <path d="M-8,-36 Q0,-42 8,-36" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
    <path d="M-12,-40 Q0,-48 12,-40" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>
