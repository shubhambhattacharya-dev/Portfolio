<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="128" height="128" rx="28" fill="#0f0f0f" stroke="#333333" stroke-width="4"/>

  <!-- Styled Terminal Brackets & Monogram -->
  <g transform="translate(20, 26)" filter="url(#glow)">
    <!-- Prompt chevron < -->
    <path d="M 12 18 L 32 38 L 12 58" fill="none" stroke="url(#amber-grad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Terminal cursor _ -->
    <rect x="42" y="50" width="34" height="9" rx="4" fill="url(#amber-grad)" />
  </g>
</svg>
